body {
    margin: 0;

    background-image: url("20261005_050113_0000.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
}

.box {
    padding: 100px 20px;
}

h2 {
    margin-bottom: 30px;
}

button {
    padding: 12px 30px;
    margin: 10px;
    border: 1px solid #333;
    background: white;
    border-radius: 8px;
    font-size: 16px;
}

.slide {
    width: 90%;
    max-width: 500px;
    height: auto;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 12px;
}

/* พลุ */
.firework {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
}

.spark {
    position: absolute;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    animation: explode 1.2s ease-out forwards;
}

@keyframes explode {
    0% {
        transform: translate(0, 0);
        opacity: 1;
    }

    100% {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}
</style>
