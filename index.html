.firework {

}

.spark {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    animation: explode 1.5s ease-out forwards;

    box-shadow:
        0 0 8px currentColor,
        0 0 18px currentColor;
}

@keyframes explode {

    0% {
        transform:
            translate(0, 0)
            scale(1);

        opacity: 1;
    }

    100% {
        transform:
            translate(var(--x), var(--y))
            scale(0.1);

        opacity: 0;
    }

}
