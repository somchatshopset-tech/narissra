<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lovebet888.com</title>

<style>

body {
    margin: 0;
    min-height: 100vh;
    background-image: url("20261005_050113_0000.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
    text-align: center;
}

.box {
    padding: 100px 20px;
}

h2 {
    margin-bottom: 30px;
}

button {
    padding: 12px 30px;
    margin: 10px;
    border: 1px solid #333;
    background: white;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.slide {
    width: 90%;
    max-width: 500px;
    height: auto;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 12px;
}


/* =========================
   พลุ
========================= */

.firework {
    position: fixed;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;

    box-shadow:
        0 0 6px white,
        0 0 12px white;

    animation: firework 1.6s ease-out forwards;
}

@keyframes firework {

    from {
        transform: translate(0, 0);
        opacity: 1;
    }

    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }

}


/* =========================
   วิดีโอวันเกิด
========================= */

.birthday-video {
    width: 90%;
    max-width: 450px;
    border-radius: 15px;
    display: block;
    margin: 20px auto;
}


/* =========================
   ข้อความวันเกิด
========================= */

.birthday-text {
    opacity: 0;
    animation: birthdayText 1.5s ease-out 0.5s forwards;
}

@keyframes birthdayText {

    to {
        opacity: 1;
    }

}

.birthday-message {
    line-height: 1.8;
    font-size: 16px;
}


/* =========================
   ปุ่ม
========================= */

.video-button {
    margin-top: 20px;
}

.next-button {
    margin-top: 25px;
}

</style>

</head>


<body>


<div class="box" id="page">

    <h2>เป็นแฟนกันมั้ย</h2>

    <button onclick="yes()">เป็น</button>

    <button onclick="no()">ไม่เป็น</button>

</div>



<script>


/* =========================
   ปุ่ม "เป็น"
========================= */

function yes() {

    createFireworks();


    document.getElementById("page").innerHTML =

    '<h2>3 ปีที่รอคอย</h2>' +

    '<img id="slide" class="slide" src="photo1.jpg">' +

    '<br><br>' +

    '<audio id="music" controls>' +

    '<source src="music.mp3" type="audio/mpeg">' +

    '</audio>' +

    '<br>' +

    '<button class="next-button" onclick="birthday()">ไปต่อ →</button>';


    var music =
        document.getElementById("music");


    music.play().catch(function() {

        console.log("กดเล่นเพลงเองได้");

    });


    var photos = [

        "photo1.jpg",
        "photo2.jpg",
        "photo3.jpg"

    ];


    var i = 0;


    setInterval(function() {

        i++;

        if (i >= photos.length) {
            i = 0;
        }

        document.getElementById("slide").src =
            photos[i];

    }, 2500);

}



/* =========================
   สร้างพลุ
========================= */

function createFireworks() {

    for (let burst = 0; burst < 10; burst++) {

        setTimeout(function() {

            let centerX =
                20 +
                Math.random() *
                (window.innerWidth - 40);

            let centerY =
                80 +
                Math.random() *
                (window.innerHeight * 0.5);


            for (let i = 0; i < 45; i++) {

                let spark =
                    document.createElement("div");

                spark.className =
                    "firework";

                spark.style.left =
                    centerX + "px";

                spark.style.top =
                    centerY + "px";


                let angle =
                    (Math.PI * 2 * i) / 45;


                let distance =
                    60 +
                    Math.random() * 130;


                spark.style.setProperty(
                    "--x",
                    Math.cos(angle) *
                    distance +
                    "px"
                );


                spark.style.setProperty(
                    "--y",
                    Math.sin(angle) *
                    distance +
                    "px"
                );


                document.body.appendChild(spark);


                setTimeout(function() {

                    spark.remove();

                }, 1600);

            }

        }, burst * 450);

    }

}



/* =========================
   หน้า Happy Birthday
========================= */

function birthday() {

    document.getElementById("page").innerHTML =

    '<h2 class="birthday-text">Happy Birthday ล่วงหน้า 2 วัน</h2>' +

    '<button class="video-button" onclick="startBirthdayVideo()">' +
    'เปิดวิดีโอ' +
    '</button>' +

    '<div id="videoArea"></div>' +

    '<div class="birthday-text birthday-message">' +

    '<h3>สุขสันต์วันเกิดครับพี่</h3>' +

    '<p>มีความสุขมากๆ ยิ้มเยอะๆ</p>' +

    '<p>ผมจะตั้งใจหาเงินพาพี่ไปกินของดีๆ</p>' +

    '<p>อยากให้อยู่กับผมไปนานๆ ทุกๆ ปี</p>' +

    '<p>เว็บนี้ผมตั้งใจทำให้พี่มาก</p>' +

    '<p>อาจจะไม่ได้ดีขนาดนั้น</p>' +

    '<p><strong>รัก</strong></p>' +

    '</div>';

}



/* =========================
   เปิดวิดีโอ
========================= */

function startBirthdayVideo() {

    document.getElementById("videoArea").innerHTML =

    '<video id="birthdayVideo" class="birthday-video" controls playsinline>' +

    '<source src="birthday_web.mp4" type="video/mp4">' +

    'เบราว์เซอร์ของคุณไม่รองรับวิดีโอ' +

    '</video>';


    var video =
        document.getElementById("birthdayVideo");


    video.volume = 1;


    video.play().catch(function() {

        console.log("กดเล่นวิดีโออีกครั้ง");

    });

}



/* =========================
   ปุ่ม "ไม่เป็น"
========================= */

function no() {

    document.getElementById("page").innerHTML =

    '<h2>กดผิดป่าวว</h2>' +

    '<button onclick="home()">ย้อนกลับ</button>';

}



/* =========================
   กลับหน้าแรก
========================= */

function home() {

    document.getElementById("page").innerHTML =

    '<h2>เป็นแฟนกันมั้ย</h2>' +

    '<button onclick="yes()">เป็น</button>' +

    '<button onclick="no()">ไม่เป็น</button>';

}

</script>


</body>
</html>
