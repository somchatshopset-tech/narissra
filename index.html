<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lovebet888.com</title>

<style>

body {
    margin: 0;
    min-height: 100vh;

    background-image: url("20261005_050113_0000.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    font-family: Arial, sans-serif;
    text-align: center;

    overflow-x: hidden;
}

.box {
    padding: 100px 20px;
    position: relative;
    z-index: 2;
}

h2 {
    margin-bottom: 30px;
}

button {
    padding: 12px 30px;
    margin: 10px;

    border: 1px solid #333;
    background: white;
    border-radius: 8px;

    font-size: 16px;

    position: relative;
    z-index: 3;
}

.slide {
    width: 90%;
    max-width: 500px;

    height: auto;
    aspect-ratio: 4 / 3;

    object-fit: cover;
    border-radius: 12px;
}


/* พื้นที่พลุ */

#fireworks {
    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    pointer-events: none;

    z-index: 999;

}

</style>
</head>


<body>


<!-- พื้นที่สำหรับพลุ -->

<canvas id="fireworks"></canvas>


<!-- หน้าเว็บ -->

<div class="box" id="page">

    <h2>เป็นแฟนกันมั้ย</h2>

    <button onclick="yes()">เป็น</button>

    <button onclick="no()">ไม่เป็น</button>

</div>


<script>


/* =========================
   กด "เป็น"
   ========================= */

function yes() {

    // ยิงพลุ
    startFireworks();


    // เปลี่ยนหน้า

    document.getElementById("page").innerHTML =

        '<h2>3 ปีที่รอคอย</h2>' +

        '<img id="slide" class="slide" src="photo1.jpg">' +

        '<br><br>' +

        '<audio id="music" controls>' +

        '<source src="music.mp3" type="audio/mpeg">' +

        '</audio>';


    // เพลง

    var music =
        document.getElementById("music");

    music.play().catch(function() {

        console.log("กดเล่นเพลงเองได้");

    });


    // รูป

    var photos = [

        "photo1.jpg",
        "photo2.jpg",
        "photo3.jpg"

    ];

    var i = 0;


    setInterval(function() {

        i++;

        if (i >= photos.length) {
            i = 0;
        }

        var slide =
            document.getElementById("slide");

        if (slide) {
            slide.src = photos[i];
        }

    }, 2500);

}



/* =========================
   ระบบพลุ 🎆
   ========================= */

function startFireworks() {

    var canvas =
        document.getElementById("fireworks");

    var ctx =
        canvas.getContext("2d");


    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;


    var particles = [];


    var colors = [

        "#ff1744",
        "#ffeb3b",
        "#00e5ff",
        "#69f0ae",
        "#ff4081",
        "#ffffff",
        "#ff9100"

    ];


    // สร้างพลุทีละชุด

    for (var f = 0; f < 7; f++) {

        setTimeout(function() {

            createFirework();

        }, f * 350);

    }


    function createFirework() {

        var x =
            Math.random() *
            canvas.width;

        var y =
            100 +
            Math.random() *
            (canvas.height * 0.45);


        var color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        // สร้างประกาย 60 จุด

        for (var i = 0; i < 60; i++) {

            var angle =
                Math.random() *
                Math.PI * 2;


            var speed =
                2 +
                Math.random() * 5;


            particles.push({

                x: x,

                y: y,

                vx:
                    Math.cos(angle) *
                    speed,

                vy:
                    Math.sin(angle) *
                    speed,

                life: 70 +
                    Math.random() * 30,

                color: color,

                size:
                    2 +
                    Math.random() * 2

            });

        }

    }


    var animation;


    function animate() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        for (
            var i = particles.length - 1;
            i >= 0;
            i--
        ) {

            var p =
                particles[i];


            p.x += p.vx;

            p.y += p.vy;

            p.vy += 0.04;

            p.vx *= 0.98;

            p.life--;


            ctx.globalAlpha =
                Math.max(
                    p.life / 100,
                    0
                );


            ctx.fillStyle =
                p.color;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fill();


            if (p.life <= 0) {

                particles.splice(i, 1);

            }

        }


        ctx.globalAlpha = 1;


        if (particles.length > 0) {

            animation =
                requestAnimationFrame(
                    animate
                );

        } else {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

        }

    }


    animate();


    // หยุดระบบหลัง 5 วินาที

    setTimeout(function() {

        cancelAnimationFrame(animation);

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }, 5000);

}



/* =========================
   ปุ่ม "ไม่เป็น"
   ========================= */

function no() {

    document.getElementById("page").innerHTML =

        '<h2>กดผิดป่าวว</h2>' +

        '<button onclick="home()">ย้อนกลับ</button>';

}



/* =========================
   กลับหน้าหลัก
   ========================= */

function home() {

    document.getElementById("page").innerHTML =

        '<h2>เป็นแฟนกันมั้ย</h2>' +

        '<button onclick="yes()">เป็น</button>' +

        '<button onclick="no()">ไม่เป็น</button>';

}

</script>

</body>
</html>
