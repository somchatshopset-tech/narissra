<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เป็นแฟนกันมั้ย</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background-image: url("20261005_050113_0000.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
    text-align: center;
}

.box {
    padding: 100px 20px;
}

h2 {
    margin-bottom: 30px;
}

button {
    padding: 12px 30px;
    margin: 10px;
    border: 1px solid #333;
    background: white;
    border-radius: 8px;
    font-size: 16px;
}

.slide {
    width: 90%;
    max-width: 400px;
    height: 450px;
    object-fit: cover;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="box" id="page">

    <h2>เป็นแฟนกันมั้ย</h2>

    <button onclick="yes()">เป็น</button>
    <button onclick="no()">ไม่เป็น</button>

</div>

<script>

function yes() {

    document.getElementById("page").innerHTML = `
        <h2>เป็นแฟนกันแล้วนะ</h2>

        <img id="slide" class="slide" src="photo1.jpg">

        <br><br>

        <audio controls autoplay>
            <source src="video_20261005_060723.mp3" type="audio/mpeg">
        </audio>
    `;

    let photos = [
        "photo1.jpg",
        "photo2.jpg",
        "photo3.jpg"
    ];

    let i = 0;

    setInterval(function() {

        i++;

        if (i >= photos.length) {
            i = 0;
        }

        document.getElementById("slide").src = photos[i];

    }, 2500);
}


function no() {

    document.getElementById("page").innerHTML = `
        <h2>กดผิดป่าวว</h2>

        <button onclick="back()">ย้อนกลับ</button>
    `;

}


function back() {
    location.reload();
}

</script>

</body>
</html>
